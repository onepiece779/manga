<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — MKM Static CMS</title>
</head>
<body>
<div id="boot" style="font-family:system-ui,sans-serif;padding:60px 20px;text-align:center;color:#444">
  <h2 style="margin:0 0 8px">CMS load ho raha hai…</h2>
  <p id="bootmsg" style="color:#888;margin:0">script download ho rahi hai</p>
</div>
<script>
(function () {
  var urls = [
    "https://unpkg.com/decap-cms@3.8.2/dist/decap-cms.js",
    "https://cdn.jsdelivr.net/npm/decap-cms@3.8.2/dist/decap-cms.js"
  ];
  var msg = document.getElementById("bootmsg");
  var i = 0;
  function fail(text) {
    document.getElementById("boot").innerHTML =
      "<h2>" + text + "</h2><p style='color:#888'>Doosra network (mobile data) try karein, ya screenshot bhejein.</p>";
  }
  function next() {
    if (i >= urls.length) { fail("CMS script load nahi hui (CDN block?)"); return; }
    msg.textContent = "CDN " + (i + 1) + " try ho raha hai…";
    var s = document.createElement("script");
    s.src = urls[i++];
    s.onload = function () {
      if (window.CMS) { var b = document.getElementById("boot"); if (b) b.remove(); }
      else { msg.textContent = "script aayi magar CMS init nahi hua"; next(); }
    };
    s.onerror = next;
    document.head.appendChild(s);
  }
  next();
})();
</script>
</body>
</html>
