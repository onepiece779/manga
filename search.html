<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse — MKM Static</title>
<link rel="stylesheet" href="assets/css/mkm.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="search" id="mkm-top">
<a class="mkm-skip-link" href="#content">Skip to content</a>

<header class="mkm-header is-sticky">
  <div class="mkm-container mkm-header-inner">
    <div class="mkm-brand">
      <a class="mkm-logo" href="index.html" aria-label="Home"><span class="mkm-logo-mark">M</span><span class="mkm-logo-text">MKM Static</span></a>
    </div>
    <nav class="mkm-nav" aria-label="Primary menu">
      <ul class="mkm-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html">Browse</a></li>
        <li><a href="index.html#latest">Latest</a></li>
      </ul>
    </nav>
    <div class="mkm-header-actions">
      <form class="mkm-search" role="search" action="search.html" method="get">
        <input type="search" name="s" placeholder="Search manga…" aria-label="Search manga">
        <button type="submit" aria-label="Search">⌕</button>
      </form>
      <button type="button" class="mkm-menu-toggle" aria-expanded="false" aria-controls="mkm-mobile-menu">
        <span class="mkm-menu-toggle-icon" aria-hidden="true"></span><span class="mkm-menu-toggle-label">Menu</span>
      </button>
    </div>
  </div>
  <div class="mkm-mobile-menu" id="mkm-mobile-menu"><div class="mkm-container">
    <ul class="mkm-mobile-nav"><li><a href="index.html">Home</a></li><li><a href="search.html">Browse</a></li><li><a href="index.html#latest">Latest</a></li></ul>
    <form class="mkm-search" role="search" action="search.html" method="get">
      <input type="search" name="s" placeholder="Search manga…" aria-label="Search manga">
      <button type="submit" aria-label="Search">⌕</button>
    </form>
  </div></div>
</header>
<div data-ad="header"></div>

<main id="content" class="mkm-main">
  <div class="mkm-container">
    <div class="mkm-layout">
      <div>
        <div class="mkm-section mkm-listing-section">
          <div class="mkm-section-head">
            <div><h1 class="mkm-title" id="q-label">Browse all manga</h1><p class="mkm-subtitle">Browse our collection</p></div>
          </div>
          <form class="mkm-search" role="search" action="search.html" method="get" style="margin-bottom:18px">
            <input type="search" name="s" placeholder="Title, author, genre…" aria-label="Search manga">
            <button type="submit" aria-label="Search">⌕</button>
          </form>
          <div data-ad="listing"></div>
          <div id="results"></div>
        </div>
      </div>
      <div class="mkm-sidebar"></div>
    </div>
  </div>
</main>
<div data-ad="footer"></div>

<footer class="mkm-footer">
  <div class="mkm-container">
    <div class="mkm-footer-bottom">
      <p>© <span data-year></span> MKM Static.</p>
      <p>Theme: <a href="https://mkm.fan/">MKM Manga Pro</a> (GPLv2) — static port</p>
    </div>
  </div>
</footer>
<button type="button" class="mkm-back-to-top" aria-label="Back to top">↑</button>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/mkm-theme-main.js"></script>
</body>
</html>
